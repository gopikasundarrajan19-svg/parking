{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0">
                        <i class="fas fa-edit"></i> Edit Parking Spot
                    </h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Spot Number</label>
                            <input type="text" 
                                   name="spot_number" 
                                   class="form-control" 
                                   value="{{ spot.spot_number }}"
                                   pattern="[A-Za-z0-9]+"
                                   required>
                            <small class="text-muted">Example: A1, B2, C3</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Spot Type</label>
                            <select name="spot_type" class="form-select">
                                <option value="car" {% if spot.spot_type == 'car' %}selected{% endif %}>🚗 Car</option>
                                <option value="bike" {% if spot.spot_type == 'bike' %}selected{% endif %}>🏍️ Bike</option>
                                <option value="ev" {% if spot.spot_type == 'ev' %}selected{% endif %}>⚡ Electric Vehicle</option>
                                <option value="disabled" {% if spot.spot_type == 'disabled' %}selected{% endif %}>♿ Disabled</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Price per hour (₹)</label>
                            <input type="number" 
                                   name="price_per_hour" 
                                   class="form-control" 
                                   value="{{ spot.price_per_hour }}"
                                   min="0"
                                   step="5"
                                   required>
                            <small class="text-muted">Multiples of ₹5 only</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select name="status" class="form-select">
                                <option value="available" {% if spot.status == 'available' %}selected{% endif %}>🟢 Available</option>
                                <option value="occupied" {% if spot.status == 'occupied' %}selected{% endif %}>🔴 Occupied</option>
                                <option value="maintenance" {% if spot.status == 'maintenance' %}selected{% endif %}>🟡 Maintenance</option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a href="{{ url_for('manage_spots') }}" class="btn btn-secondary">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                            <button type="submit" class="btn btn-warning">
                                <i class="fas fa-save"></i> Update Spot
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
