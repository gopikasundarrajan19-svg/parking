{% extends "base.html" %}

{% block content %}
<h2>Edit Staff Member</h2>

<div class="row">
    <div class="col-md-6 mx-auto">
        <div class="card">
            <div class="card-header">
                <h5>Edit Staff Details</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('update_staff', staff_id=staff.id) }}">
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ staff.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ staff.email }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone</label>
                        <input type="tel" class="form-control" id="phone" name="phone" value="{{ staff.phone }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="position" class="form-label">Position</label>
                        <select class="form-control" id="position" name="position" required>
                            <option value="Security Guard" {% if staff.position == 'Security Guard' %}selected{% endif %}>Security Guard</option>
                            <option value="Supervisor" {% if staff.position == 'Supervisor' %}selected{% endif %}>Supervisor</option>
                            <option value="Cleaner" {% if staff.position == 'Cleaner' %}selected{% endif %}>Cleaner</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="shift" class="form-label">Shift</label>
                        <select class="form-control" id="shift" name="shift" required>
                            <option value="morning" {% if staff.shift == 'morning' %}selected{% endif %}>Morning</option>
                            <option value="evening" {% if staff.shift == 'evening' %}selected{% endif %}>Evening</option>
                            <option value="night" {% if staff.shift == 'night' %}selected{% endif %}>Night</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="salary" class="form-label">Salary (₹)</label>
                        <input type="number" step="0.01" class="form-control" id="salary" name="salary" value="{{ staff.salary }}" required>
                    </div>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('manage_staff') }}" class="btn btn-secondary me-md-2">Cancel</a>
                        <button type="submit" class="btn btn-primary">Update Staff</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
