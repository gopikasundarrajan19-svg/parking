{% extends "base.html" %}

{% block content %}
<h2>Staff Management</h2>

<div class="row">
    <div class="col-md-4">
        <div class="card">
            <div class="card-header">
                <h5>Add Staff</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('add_staff') }}">
                    <div class="mb-2"><input type="text" name="name" placeholder="Name" class="form-control" required></div>
                    <div class="mb-2"><input type="email" name="email" placeholder="Email" class="form-control" required></div>
                    <div class="mb-2"><input type="tel" name="phone" placeholder="Phone" class="form-control" required></div>
                    <div class="mb-2">
                        <select name="position" class="form-control">
                            <option>Security Guard</option><option>Supervisor</option><option>Cleaner</option>
                        </select>
                    </div>
                    <div class="mb-2">
                        <select name="shift" class="form-control">
                            <option value="morning">Morning</option><option value="evening">Evening</option><option value="night">Night</option>
                        </select>
                    </div>
                    <div class="mb-2"><input type="number" name="salary" placeholder="Salary" class="form-control" required></div>
                    <button type="submit" class="btn btn-primary w-100">Add</button>
                </form>
            </div>
        </div>
    </div>
    
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5>Staff List</h5>
            </div>
            <div class="card-body">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Position</th>
                            <th>Shift</th>
                            <th>Salary</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for staff in staff_members %}
                        <tr>
                            <td>{{ staff.name }}</td>
                            <td>{{ staff.position }}</td>
                            <td>{{ staff.shift }}</td>
                            <td>₹{{ staff.salary }}</td>
                            <td>
                                <a href="{{ url_for('edit_staff', staff_id=staff.id) }}" 
                                   class="btn btn-primary btn-sm">Edit</a>
                                <a href="{{ url_for('delete_staff', staff_id=staff.id) }}" 
                                   class="btn btn-danger btn-sm" 
                                   onclick="return confirm('Delete this staff member?')">Delete</a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
